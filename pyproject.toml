[project]
name = "ha-mylifter"
version = "0.1.0"
description = "Home Assistant custom integration for GarageSmart MyLifter ceiling hoists (BLE)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    # No release exists for HA 2026.11.x yet; 0.13.375 pins homeassistant==2026.10.4.
    # See DECISIONS.md "Test harness version".
    "pytest-homeassistant-custom-component==0.13.375",
    # Requirements of HA 2026.11.1's bluetooth integration (identical in 2026.10.4).
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.1",
    "bluetooth-adapters==2.4.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.24",
    "dbus-fast==5.0.22",
    "habluetooth==7.1.2",
    "ruff==0.17.3",
]

[tool.uv]
package = false
