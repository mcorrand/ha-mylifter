[project]
name = "ha-mylifter"
version = "0.1.0"
description = "Home Assistant custom integration for GarageSmart MyLifter ceiling hoists (BLE)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    # No release exists for HA 2026.11.x yet; 0.13.375 pins homeassistant==2026.10.4.
    # See DECISIONS.md "Test harness version".
    "pytest-homeassistant-custom-component==0.13.375",
    # Requirements of HA 2026.11.1's bluetooth integration (identical in 2026.10.4).
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.1",
    "bluetooth-adapters==2.4.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.24",
    "dbus-fast==5.0.22",
    "habluetooth==7.1.2",
    # bluetooth depends on usb; its requirements as pinned by the HA test harness
    # version (2026.10.4; 2026.11.1 uses serialx 1.15.1).
    "aiousbwatcher==1.1.2",
    "serialx==1.11.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = [".git", ".scratch", "testing_config"]

# Ruff configuration mirrors Home Assistant core 2026.11.1 (pyproject.toml [tool.ruff]),
# minus core-only per-file ignores and the long list of PLATFORM_SCHEMA aliases.
[tool.ruff]
required-version = ">=0.17.3"
target-version = "py314"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = [
    "A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ003", "DTZ004", "DTZ011",
    "E", "F", "F541", "FLY", "FURB", "G", "I", "INP", "ISC", "ICN001", "ICN002",
    "LOG", "N804", "N805", "N806", "N815", "PERF", "PGH", "PIE", "PL", "PT", "PTH",
    "PYI", "RET", "RSE", "RUF", "S107", "S102", "S103", "S108", "S301", "S306",
    "S307", "S313", "S314", "S315", "S316", "S317", "S318", "S319", "S601", "S602",
    "S604", "S608", "S609", "SIM", "SLF", "SLOT", "T100", "T20", "TC", "TID", "TRY",
    "UP", "UP031", "UP032", "W",
]
ignore = [
    "ASYNC109", "ASYNC110", "ASYNC240", "B008", "B019", "D202", "D203", "D213",
    "D406", "D407", "D417", "E501", "PLC1901", "PLR0911", "PLR0912", "PLR0913",
    "PLR0915", "PLR0917", "PLR2004", "PLW0108", "PLW1641", "PLW2901", "PT011",
    "PT018", "RUF001", "RUF012", "RUF015", "RUF043", "SIM102", "SIM103", "SIM108",
    "SIM115", "TC001", "TC002", "TC003", "TC006", "TRY003", "TRY400", "UP047",
    "UP049", "W191", "E111", "E114", "E117", "D206", "D300", "Q", "COM812",
    "COM819", "PLE0605", "FURB116", "ISC004", "LOG004",
]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"homeassistant.helpers.area_registry" = "ar"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.issue_registry" = "ir"
"homeassistant.util.dt" = "dt_util"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"voluptuous".msg = "use probatio instead"
"__future__.annotations".msg = "It should not be needed because Home Assistant requires Python 3.14+"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH"]
"custom_components/**" = ["PTH"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"
